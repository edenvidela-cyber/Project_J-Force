                <!-- a form that sends a message towards the developer, and even asks if you want to sign up for the newsletter! -->
                 <div>
                <form action="/path_to_my_server" method="GET" enctype="multipart/form-data">
                    <label class="color-coded" for="username_id">Please provide your name:</label>
                    <input class="Contact-Us" type="text" name="user_name" id="username_id" maxlength="20" minlength="5">
                    
                 </div>    
                   <div>                
                    <label class="color-coded" for="pass_id">A password you'll remember:</label>

                    <label class="color-coded" for="Newsletter_id">Would you like to sign up for our newsletter?</label>
                    <input class="checkbox" type="checkbox" name="newsletter" id="Newsletter_id">
                    </div>
                    <div>
                    <label class="color-coded" for="email_id">Your email address:</label>
                    <input class="Contact-Us" type="email" name="user_email" id="email_id">
                    </div>
                     <div>                    
                    <label class="color-coded" for="Message">Message:</label>
                    <textarea class="Contact-Us-tbox" name="user_message" id="Message" rows="4" cols="50" Maxheight=415px width=100.667px></textarea>
                     </div>
                     <div>
                    <input class="Buttons" type="submit" value="Send!" id="submit_id">
